<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>ZestIslam | Modern AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              arabic: ['Amiri', 'serif'],
            },
            colors: {
              emerald: { 950: '#011c16' },
              slate: { 850: '#151e2d', 950: '#020617' }
            },
            borderRadius: { '4xl': '2rem', '5xl': '2.5rem' }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        @apply bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white antialiased overflow-x-hidden transition-colors duration-300;
      }
      
      .mesh-gradient {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(20, 184, 166, 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.05) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
        transition: background 0.5s ease;
      }

      .dark .mesh-gradient {
        background-color: #020617;
        background-image: 
          radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(20, 184, 166, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      }

      .font-quran {
        font-family: 'Amiri', serif;
        line-height: 2.2;
        direction: rtl;
      }

      .glass-card {
        @apply bg-white/60 dark:bg-slate-900/40 backdrop-blur-xl border border-white/20 dark:border-white/5 shadow-xl text-slate-900 dark:text-white;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      .animate-fade-in-up {
        animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.569.0",
    "marked": "https://esm.sh/marked@^17.0.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3"
  }
}
</script>
</head>
  <body>
    <div class="mesh-gradient"></div>
    <div id="root"></div>
  </body>
</html>
